<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNGL Canlı Yayınlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712;
        }
    </style>
</head>
<body class="text-gray-100 font-sans min-h-screen">

    <header class="border-b border-gray-900 bg-gray-950/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="w-4 h-4 rounded-full bg-red-500 animate-pulse"></span>
                <h1 class="text-2xl font-black tracking-tight text-white uppercase">
                    KNGL <span class="text-indigo-500">Live</span>
                </h1>
            </div>
            <div class="text-sm text-gray-400">
                Aktif Yayıncılar
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="w-full h-[800px] rounded-2xl overflow-hidden border border-gray-900 shadow-2xl bg-gray-900/40">
            <iframe 
                src="https://knglrp.com/streamers" 
                class="w-full h-full border-0 bg-transparent"
                title="KNGL Streamers"
                sandbox="allow-scripts allow-same-origin">
            </iframe>
        </div>
    </main>

</body>
</html>
