<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNGL Canlı Yayınlar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .preview-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .preview-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="border-b border-slate-900 bg-slate-900/50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="image_469ee5.png" alt="KNGL Logo" class="w-10 h-10 object-contain rounded-full border border-indigo-500/30">
                <h1 class="text-2xl font-black tracking-tight text-white">
                    KNGL <span class="text-indigo-500">LIVE</span>
                </h1>
            </div>
            <div class="text-sm text-slate-400">
                Aktif Yayıncılar: <span id="count" class="text-indigo-400 font-bold">0</span>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-6 py-12 text-center">
        <div class="flex flex-col items-center">
            <img src="image_469ee5.png" alt="KNGL Elite Logo" class="w-32 h-32 object-contain mb-6 drop-shadow-[0_0_15px_rgba(99,102,241,0.3)]">
            <h2 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-3">
                KNGL ELITE <span class="text-indigo-500">DASHBOARD</span>
            </h2>
            <p class="text-slate-400 text-sm md:text-base max-w-xl leading-relaxed">
                KNGL topluluğunun Kick platformundaki canlı yayınlarını, anlık izleyici sayılarını ve özetlerini tek ekrandan takip edin.
            </p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-6 py-6 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="streamContainer">
            <div class="col-span-full text-center py-20 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-4xl mb-4 text-indigo-500"></i>
                <p class="text-lg">Yayınlar taranıyor...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-500">
        KNGL Topluluğu &copy; 2026
    </footer>

    <script>
        async function fetchStreams() {
            try {
                const response = await fetch('/api/streams');
                const data = await response.json();

                const container = document.getElementById('streamContainer');
                const countEl = document.getElementById('count');

                if (data.success && data.streams.length > 0) {
                    countEl.textContent = data.streams.length;
                    container.innerHTML = '';
                    
                    data.streams.forEach(stream => {
                        const cardHTML = `
                            <div class="preview-card bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
                                <div class="relative aspect-video bg-slate-950 overflow-hidden">
                                    <img src="${stream.thumbnail}" alt="${stream.username}" class="w-full h-full object-cover">
                                    <div class="absolute top-3 left-3 flex items-center space-x-2">
                                        <span class="bg-red-600 text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider text-white flex items-center gap-1.5">
                                            <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>
                                            CANLI
                                        </span>
                                        <span class="bg-black/70 backdrop-blur text-[11px] text-slate-300 font-medium px-2.5 py-1 rounded-md">
                                            <i class="fa-solid fa-eye text-red-400 mr-1"></i> ${stream.viewers.toLocaleString()}
                                        </span>
                                    </div>
                                </div>
                                
                                <div class="p-5">
                                    <div class="flex items-center space-x-3 mb-4">
                                        <img src="${stream.avatar}" alt="${stream.username}" class="w-10 h-10 rounded-full border border-indigo-500 object-cover">
                                        <div class="truncate">
                                            <h3 class="font-bold text-white text-base leading-tight truncate">${stream.username}</h3>
                                            <p class="text-xs text-indigo-400 font-medium truncate">${stream.category}</p>
                                        </div>
                                    </div>
                                    
                                    <p class="text-sm text-slate-400 line-clamp-2 mb-5 h-10 leading-5 overflow-hidden text-ellipsis">
                                        ${stream.description}
                                    </p>

                                    <a href="${stream.url}" target="_blank" class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-3 rounded-lg transition-all shadow-lg shadow-indigo-600/20">
                                        Yayına Git
                                    </a>
                                </div>
                            </div>
                        `;
                        container.innerHTML += cardHTML;
                    });
                } else {
                    countEl.textContent = '0';
                    container.innerHTML = `
                        <div class="col-span-full text-center py-20 text-slate-500">
                            <i class="fa-regular fa-folder-open text-4xl mb-4 text-slate-600"></i>
                            <p class="text-lg">Şu an KNGL etiketiyle aktif yayın bulunamadı.</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error("Yayınlar yüklenirken hata oluştu:", error);
                document.getElementById('streamContainer').innerHTML = `
                    <div class="col-span-full text-center py-20 text-red-400">
                        <i class="fa-solid fa-triangle-exclamation text-4xl mb-4 text-red-500"></i>
                        <p class="text-lg">Bağlantı hatası: Sunucuya ulaşılamadı.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchStreams);
        // Her 60 saniyede bir otomatik yenileme
        setInterval(fetchStreams, 60000);
    </script>
</body>
</html>
